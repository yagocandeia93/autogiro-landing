<script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<script src=\"6e94bcd8-85ab-44c3-b621-21e37da3cb7d\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #0a0e14; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: #f5a524; }\n  a:hover { color: #ffc35c; }\n  input, select, button { font-family: inherit; }\n  input::placeholder { color: #7c8899; }\n  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #f5a524; outline-offset: 2px; }\n  input[type=\"range\"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14); outline: none; }\n  input[type=\"range\"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #f5a524; border: 3px solid #0a0e14; box-shadow: 0 0 0 1px rgba(245,165,36,0.55); cursor: grab; }\n  input[type=\"range\"]::-webkit-slider-thumb:active { cursor: grabbing; }\n  input[type=\"range\"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #f5a524; border: 3px solid #0a0e14; box-shadow: 0 0 0 1px rgba(245,165,36,0.55); cursor: grab; }\n  input[type=\"range\"]::-moz-range-track { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14); }\n  @media (prefers-reduced-motion: no-preference) {\n    html.ag-js [data-reveal], html.ag-js [data-stagger] > * {\n      opacity: 0;\n      transform: translateY(35px);\n      transition: opacity .78s cubic-bezier(0.16, 1, 0.3, 1), transform .78s cubic-bezier(0.16, 1, 0.3, 1);\n      transition-delay: var(--ag-delay, 0s);\n      will-change: opacity, transform;\n    }\n    html.ag-js [data-reveal][data-shown], html.ag-js [data-stagger][data-shown] > * { opacity: 1; transform: translateY(0); }\n    html.ag-js [data-stagger] > * { --ag-delay: 0s; }\n    html.ag-js [data-stagger][data-shown] > *:nth-child(2) { transition-delay: .09s; }\n    html.ag-js [data-stagger][data-shown] > *:nth-child(3) { transition-delay: .18s; }\n    html.ag-js [data-stagger][data-shown] > *:nth-child(4) { transition-delay: .27s; }\n    html.ag-js [data-stagger][data-shown] > *:nth-child(5) { transition-delay: .36s; }\n    html.ag-js [data-stagger][data-shown] > *:nth-child(6) { transition-delay: .45s; }\n  }\n  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n<\/style>\n<\/helmet>\n\n<div style=\"background: #0a0e14; color: #e9edf3; min-height: 100vh; overflow-x: clip;\">\n\n  <!-- CALCULADORA DE GIRO -->\n  <section id=\"calculadora\" style=\"border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); background: #0c1119;\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 7vw, 104px) clamp(20px, 5vw, 64px);\">\n      <div data-reveal=\"\" style=\"max-width: 60ch; margin-bottom: 44px;\">\n        <h2 style=\"font-size: clamp(27px, 2.9vw, 37px); line-height: 1.14; letter-spacing: -0.022em; font-weight: 700; margin: 0 0 14px;\">O dinheiro est\u00e1 parado no p\u00e1tio.<\/h2>\n        <p style=\"font-size: 16.5px; line-height: 1.6; color: #94a1b5; margin: 0;\">Ajuste os quatro n\u00fameros da sua loja. O c\u00e1lculo compara o giro de hoje com o mesmo estoque girando {{ reducaoLabel }} mais r\u00e1pido e com {{ margemGanhoLabel }} a mais de margem.<\/p>\n      <\/div>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch;\" data-stagger=\"\" class=\"ag-calc\">\n        <div style=\"background: #0e141d; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: clamp(22px, 3vw, 32px); display: grid; gap: 26px; align-content: start;\">\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px;\">\n              <label for=\"ag-calc-estoque\" style=\"font-size: 14.5px; color: #c7d0dc; font-weight: 500;\">Estoque atual<\/label>\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 17px; font-weight: 600; color: #f5a524;\">{{ estoqueLabel }}<\/span>\n            <\/div>\n            <input id=\"ag-calc-estoque\" type=\"range\" min=\"5\" max=\"150\" step=\"1\" value=\"{{ estoque }}\" sc-camel-on-input=\"{{ onEstoque }}\">\n          <\/div>\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px;\">\n              <label for=\"ag-ticket\" style=\"font-size: 14.5px; color: #c7d0dc; font-weight: 500;\">Ticket m\u00e9dio<\/label>\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 17px; font-weight: 600; color: #f5a524;\">{{ ticketLabel }}<\/span>\n            <\/div>\n            <input id=\"ag-ticket\" type=\"range\" min=\"15000\" max=\"250000\" step=\"5000\" value=\"{{ ticket }}\" sc-camel-on-input=\"{{ onTicket }}\">\n          <\/div>\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px;\">\n              <label for=\"ag-margem\" style=\"font-size: 14.5px; color: #c7d0dc; font-weight: 500;\">Margem bruta m\u00e9dia<\/label>\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 17px; font-weight: 600; color: #f5a524;\">{{ margemLabel }}<\/span>\n            <\/div>\n            <input id=\"ag-margem\" type=\"range\" min=\"4\" max=\"30\" step=\"0.5\" value=\"{{ margem }}\" sc-camel-on-input=\"{{ onMargem }}\">\n          <\/div>\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px;\">\n              <label for=\"ag-patio\" style=\"font-size: 14.5px; color: #c7d0dc; font-weight: 500;\">Tempo m\u00e9dio de p\u00e1tio<\/label>\n 524; width: {{ barraGanho }}; transition: width .25s cubic-bezier(0.16,1,0.3,1);\"><\/div>\n            <\/div>\n            <p style=\"margin: 2px 0 0; font-size: 12.5px; color: #7c8899;\">Capital de {{ capitalLabel }} imobilizado no p\u00e1tio hoje.<\/p>\n          <\/div>\n\n          <a href=\"#demo\" data-ag-demo=\"\" style=\"margin-top: auto; display: block; text-align: center; padding: 13px; border-radius: 10px; background: #f5a524; color: #1b1305; font-size: 14.5px; font-weight: 600; text-decoration: none; transition: background .2s, transform .12s;\" style-hover=\"background: #ffb640;\" style-active=\"transform: translateY(1px);\">Ver esse c\u00e1lculo com o meu estoque<\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ESTOQUE: split texto + mockup -->\n  <section id=\"estoque\" style=\"max-width: 1400px; margin: 0 auto; padding: clamp(64px, 7vw, 104px) clamp(20px, 5vw, 64px); display: grid; grid-template-columns: 0.9fr 1.1fr; gap: clamp(32px, 5vw, 72px); align-items: center;\" class=\"ag-split\">\n    <div data-reveal=\"\">\n      <span style=\"font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #f5a524;\">Gest\u00e3o de estoque<\/span>\n      <h2 style=\"font-size: clamp(27px, 2.9vw, 37px); line-height: 1.14; letter-spacing: -0.022em; font-weight: 700; margin: 14px 0 16px;\">O custo real do carro, n\u00e3o o pre\u00e7o de compra.<\/h2>\n      <p style=\"font-size: 16.5px; line-height: 1.6; color: #94a1b5; margin: 0 0 24px; max-width: 52ch;\">Cada ve\u00edculo carrega compra, prepara\u00e7\u00e3o, documenta\u00e7\u00e3o e tempo de p\u00e1tio. O sistema fecha a margem sozinho e compara com a tabela FIPE na hora da precifica\u00e7\u00e3o.<\/p>\n      <div style=\"display: grid; gap: 14px; max-width: 46ch;\">\n        <div style=\"display: flex; gap: 11px; align-items: flex-start;\">\n          <span style=\"width: 17px; height: 17px; flex: 0 0 17px; margin-top: 3px; background: #f5a524; display: block; mask-image: url(&quot;f56e1942-007e-4fa9-ae5f-73f9cf3d3029&quot;); -webkit-mask-image: url(&quot;f56e1942-007e-4fa9-ae5f-73f9cf3d3029&quot;); mask-size: contain; -webkit-mask-size: contain; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;\"><\/span>\n          <p style=\"margin: 0; font-size: 15px; color: #c7d0dc; line-height: 1.5;\">Centro de custos por ve\u00edculo, com lan\u00e7amento de despesa de funilaria, revis\u00e3o e documenta\u00e7\u00e3o.<\/p>\n        <\/div>\n        <div style=\"display: flex; gap: 11px; align-items: flex-start;\">\n          <span style=\"width: 17px; height: 17px; flex: 0 0 17px; margin-top: 3px; background: #f5a524; display: block; mask-image: url(&quot;f56e1942-007e-4fa9-ae5f-73f9cf3d3029&quot;); -webkit-mask-image: url(&quot;f56e1942-007e-4fa9-ae5f-73f9cf3d3029&quot;); mask-size: contain; -webkit-mask-size: contain; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;\"><\/span>\n          <p style=\"margin: 0; font-size: 15px; color: #c7d0dc; line-height: 1.5;\">Consulta FIPE integrada e alerta quando o pre\u00e7o anunciado sai da faixa de mercado.<\/p>\n        <\/div>\n        <div style=\"display: flex; gap: 11px; align-items: flex-start;\">\n          <span style=\"width: 17px; height: 17px; flex: 0 0 17px; margin-top: 3px; background: #f5a524; display: block; mask-image: url(&quot;f56e1942-007e-4fa9-ae5f-73f9cf3d3029&quot;); -webkit-mask-image: url(&quot;f56e1942-007e-4fa9-ae5f-73f9cf3d3029&quot;); mask-size: contain; -webkit-mask-size: contain; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;\"><\/span>\n          <p style=\"margin: 0; font-size: 15px; color: #c7d0dc; line-height: 1.5;\">Controle de ATPV-e, laudo cautelar e prazos que travam a venda.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div data-reveal=\"\" style=\"--ag-delay: .12s; background: #0e141d; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 20px;\">\n      <div style=\"display: flex; align-it 'Geist Mono', monospace; font-size: 14.5px;\">R$ 175.300<\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n        <div>\n          <p style=\"margin: 0; font-size: 11.5px; color: #94a1b5;\">Margem projetada<\/p>\n          <p style=\"margin: 3px 0 0; font-family: 'Geist Mono', monospace; font-size: 20px; font-weight: 600; color: #f5a524;\">R$ 18.230<\/p>\n        <\/div>\n        <div style=\"text-align: right;\">\n          <p style=\"margin: 0; font-size: 11.5px; color: #94a1b5;\">Dias em p\u00e1tio<\/p>\n          <p style=\"margin: 3px 0 0; font-family: 'Geist Mono', monospace; font-size: 20px; font-weight: 600;\">17<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- CRM: split invertido -->\n  <section id=\"crm\" style=\"background: #0c1119; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08);\">\n    <div data-stagger=\"\" style=\"max-width: 1400px; margin: 0 auto; padding: clamp(64px, 7vw, 104px) clamp(20px, 5vw, 64px); display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(32px, 5vw, 72px); align-items: center;\" class=\"ag-split-rev\">\n      <div style=\"background: #0e141d; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 18px;\">\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;\" class=\"ag-kanban\">\n          <div>\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;\">\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #94a1b5;\">Novo<\/span>\n              <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b7889;\">6<\/span>\n            <\/div>\n            <div style=\"display: grid; gap: 8px;\">\n  letter-spacing: -0.02em;\">R$ 299<span style=\"font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 400; color: #94a1b5;\"> \/m\u00eas<\/span><\/p>\n        <div style=\"display: grid; gap: 12px; margin-bottom: 28px;\">\n          <p style=\"margin: 0; font-size: 14.5px; color: #c7d0dc;\">At\u00e9 10 ve\u00edculos ativos em estoque<\/p>\n          <p style=\"margin: 0; font-size: 14.5px; color: #c7d0dc;\">1 usu\u00e1rio: apenas o dono (gest\u00e3o individual)<\/p>\n          <p style=\"margin: 0; font-size: 14.5px; color: #c7d0dc;\">Custos por ve\u00edculo, consulta FIPE e placa<\/p>\n          <p style=\"margin: 0; font-size: 14.5px; color: #c7d0dc;\">Vendas, contratos, cobran\u00e7as e painel de margem<\/p>\n        <\/div>\n        <a href=\"\/inscricao?plano=BASICO\" style=\"display: block; text-align: center; padding: 13px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); color: #e9edf3; font-size: 14.5px; font-weight: 600; text-decoration: none; transition: border-color .2s, background .2s;\" style-hover=\"border-color: rgba(255,255,255,0.32); background: rgba(255,255,255,0.04);\">Assinar agora<\/a>\n      <\/div>\n      <div style=\"background: #111823; border: 1px solid #f5a524; border-radius: 14px; padding: 30px; position: relative;\">\n        <span style=\"position: absolute; top: 18px; right: 20px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #f5a524; color: #1b1305;\">{{ badgeLabel }}<\/span>\n        <p style=\"margin: 0 0 6px; font-size: 16px; font-weight: 600;\">Pro<\/p>\n        <p style=\"margin: 0 0 20px; font-size: 13.5px; color: #94a1b5;\">Opera\u00e7\u00e3o que vive de giro e margem.<\/p>\n        <p style=\"margin: 0 0 26px; font-family: 'Geist Mono', monospace; font-size: 34px; font-weight: 600; letter-spacing: -0.02em;\">R$ 499<span style=\"font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 400; color: #94a1b5;\"> \/m\u00eas<\/span><\/p>\n        <div style=\"display: grid; gap: 12px; margin-bottom: 28px;\">\n          <p style=\"margin: 0; font-size: 14.5px; color: #e9edf3;\">Estoque sem limite de ve\u00edculos e 5 usu\u00e1rios<\/p>\n          <p style=\"margin: 0; font-size: 14.5px; color: #e9edf3;\">CRM de leads em Kanban com WhatsApp<\/p>\n          <p style=\"margin: 0; font-size: 14.5px; color: #e9edf3;\">Publica\u00e7\u00e3o autom\u00e1tica nos portais parceiros<\/p>\n          <p style=\"margin: 0; font-size: 14.5px; color: #e9edf3;\">Mesa de cr\u00e9dito multibancos em uma proposta<\/p>\n        <\/div>\n        <a href=\"\/inscricao?plano=PRO\" style=\"display: block; text-align: center; padding: 13px; border-radius: 10px; background: #f5a524; color: #1b1305; font-size: 14.5px; font-weight: 600; text-decoration: none; transition: background .2s, transform .12s;\" style-hover=\"background: #ffb640;\" style-active=\"transform: translateY(1px);\">Come\u00e7ar agora<\/a>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- LEGAL -->\n  <section id=\"legal\" style=\"border-top: 1px solid rgba(255,255,255,0.08); background: #0a0e14;\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(56px, 6vw, 88px) clamp(20px, 5vw, 64px);\">\n      <div data-reveal=\"\" style=\"max-width: 58ch; margin-bottom: 40px;\">\n        <h2 style=\"font-size: clamp(24px, 2.6vw, 33px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700; margin: 0 0 12px;\">Regras claras sobre os seus dados.<\/h2>\n        <p style=\"margin: 0; font-size: 16px; color: #94a1b5; line-height: 1.6;\">Resumo das tr\u00eas pol\u00edticas que regem o uso do AutoGiro DMS. A vers\u00e3o integral \u00e9 entregue junto do contrato de assinatura.<\/p>\n      <\/div>\n\n      <div data-stagger=\"\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;\" class=\"ag-legal\">\n        <article id=\"privacidade\" style=\"background: #0e141d; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 26px; display: grid; gap: 14px; align-content: start;\">\n          <h3 style=\"margin: 0; font-size: 16.5px; font-weight: 600;\">Pol\u00edtica de privacidade<\/h3>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">As informa\u00e7\u00f5es comerciais da sua revenda s\u00e3o confidenciais. Pre\u00e7o de compra, margem por ve\u00edculo, despesas de p\u00e1tio, comiss\u00e3o de vendedor e carteira de clientes ficam vis\u00edveis apenas para os usu\u00e1rios da pr\u00f3pria loja.<\/p>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">N\u00e3o vendemos, alugamos nem compartilhamos esses dados com terceiros, e n\u00e3o os usamos para alimentar bases de mercado ou comparativos entre lojas. O acesso da nossa equipe \u00e9 restrito a chamados de suporte abertos por voc\u00ea, sempre registrado.<\/p>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">Os bancos de dados ficam hospedados no Brasil, com backup di\u00e1rio e tr\u00e1fego criptografado.<\/p>\n        <\/article>\n\n        <article id=\"termos\" style=\"background: #0e141d; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 26px; display: grid; gap: 14px; align-content: start;\">\n          <h3 style=\"margin: 0; font-size: 16.5px; font-weight: 600;\">Termos de uso<\/h3>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">O AutoGiro DMS \u00e9 licenciado como software de gest\u00e3o por assinatura mensal, sem fidelidade. A licen\u00e7a vale para a loja contratante e para os usu\u00e1rios que ela cadastrar, dentro do limite do plano vigente. Credenciais s\u00e3o pessoais e n\u00e3o devem ser compartilhadas.<\/p>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">Trabalhamos com meta de disponibilidade de 99,5% ao m\u00eas, fora janelas de manuten\u00e7\u00e3o programada, comunicadas com anteced\u00eancia. Integra\u00e7\u00f5es com portais, bancos e \u00f3rg\u00e3os externos dependem da disponibilidade desses servi\u00e7os.<\/p>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">A responsabilidade pelo conte\u00fado lan\u00e7ado no sistema \u00e9 da loja: valores, documentos fiscais, contratos e an\u00fancios publicados. O sistema organiza e calcula sobre o que foi informado, e n\u00e3o substitui a confer\u00eancia cont\u00e1bil e fiscal.<\/p>\n        <\/article>\n\n        <article id=\"lgpd\" style=\"background: #0e141d; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 26px; display: grid; gap: 14px; align-content: start;\">\n          <h3 style=\"margin: 0; font-size: 16.5px; font-weight: 600;\">Tratamento de dados (LGPD)<\/h3>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">Os dados pessoais de compradores e interessados registrados no CRM pertencem exclusivamente \u00e0 revenda. Perante a Lei 13.709\/2018, a loja \u00e9 a controladora desses dados e o AutoGiro DMS atua como operador, tratando as informa\u00e7\u00f5es apenas para executar as fun\u00e7\u00f5es contratadas.<\/p>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">Cabe \u00e0 loja ter base legal para o cadastro e atender aos pedidos de titulares. O sistema oferece as ferramentas para isso: exporta\u00e7\u00e3o, corre\u00e7\u00e3o e exclus\u00e3o de cadastros a qualquer momento.<\/p>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #b3bdcc;\">Ao encerrar a assinatura, a loja pode exportar toda a base. Os dados s\u00e3o eliminados dos nossos ambientes em at\u00e9 90 dias, ressalvado o que a legisla\u00e7\u00e3o fiscal obrigue a reter.<\/p>\n        <\/article>\n      <\/div>\n\n      <p style=\"margin: 28px 0 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #6b7889;\">\u00daltima atualiza\u00e7\u00e3o: agosto de 2026. Encarregado de dados: privacidade@autogirodms.com.br<\/p>\n    <\/div>\n  <\/section>\n\n  <footer style=\"border-top: 1px solid rgba(255,255,255,0.08); padding: 48px clamp(20px, 5vw, 64px) 36px;\">\n    <div style=\"max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 40px;\" class=\"ag-footer\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 12px;\">\n          <span style=\"width: 22px; height: 22px; border-radius: 7px; background: #f5a524; display: block; mask-image: url(&quot;2794b728-5fb4-4c91-a053-0d8543f15ec6&quot;); -webkit-mask-image: url(&quot;2794b728-5fb4-4c91-a053-0d8543f15ec6&quot;); mask-size: 19px; -webkit-mask-size: 19px; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat; mask-position: center; -webkit-mask-position: center;\"><\/span>\n          <span style=\"font-size: 15px; font-weight: 700;\">AutoGiro DMS<\/span>\n        <\/div>\n        <p style=\"margin: 0 0 8px; font-size: 13.5px; color: #94a1b5; line-height: 1.6; max-width: 34ch;\">Sistema de gest\u00e3o para concession\u00e1rias, lojas de seminovos e opera\u00e7\u00f5es de repasse.<\/p>\n        <p style=\"margin: 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #6b7889;\">Dados hospedados no Brasil, com backup di\u00e1rio.<\/p>\n      <\/div>\n      <div>\n        <p style=\"margin: 0 0 12px; font-size: 13px; font-weight: 600; color: #c7d0dc;\">Produto<\/p>\n        <div style=\"display: grid; gap: 9px;\">\n          <a href=\"#estoque\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">Gest\u00e3o de estoque<\/a>\n          <a href=\"#crm\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">CRM e funil<\/a>\n          <a href=\"#portais\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">Portais e redes<\/a>\n        <\/div>\n      <\/div>\n      <div>\n        <p style=\"margin: 0 0 12px; font-size: 13px; font-weight: 600; color: #c7d0dc;\">Empresa<\/p>\n        <div style=\"display: grid; gap: 9px;\">\n          <a href=\"#planos\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">Planos<\/a>\n          <a href=\"#demo\" data-ag-demo=\"\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">Agendar demonstra\u00e7\u00e3o<\/a>\n          <a href=\"{{ waLinkSuporte }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">Suporte<\/a>\n        <\/div>\n      <\/div>\n      <div>\n        <p style=\"margin: 0 0 12px; font-size: 13px; font-weight: 600; color: #c7d0dc;\">Legal<\/p>\n        <div style=\"display: grid; gap: 9px;\">\n          <a href=\"#privacidade\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">Pol\u00edtica de privacidade<\/a>\n          <a href=\"#termos\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">Termos de uso<\/a>\n          <a href=\"#lgpd\" style=\"font-size: 13.5px; color: #94a1b5; text-decoration: none; transition: color .2s;\" style-hover=\"color: #ffffff;\">Tratamento de dados (LGPD)<\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n    <p style=\"max-width: 1400px; margin: 40px auto 0; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.07); font-size: 12.5px; color: #6b7889;\">\u00a9 2026 AutoGiro DMS. Todos os direitos reservados.<\/p>\n  <\/footer>\n\n  <style>\n    @media (max-width: 1100px) {\n      .ag-nav { display: none !important; }\n    }\n    @media (max-width: 1150px) {\n      .ag-legal { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }\n    }\n    @media (max-width: 1024px) {\n      .ag-portals { grid-template-columns: 1fr 1fr !important; }\n      .ag-footer { grid-template-columns: 1fr 1fr !important; }\n    }\n    @media (max-width: 900px) {\n      .ag-split, .ag-split-rev { grid-template-columns: 1fr !important; }\n      .ag-split-rev > div:first-child { order: 2; }\n      .ag-bento { grid-template-columns: 1fr !important; }\n      .ag-bento > div:first-child { grid-row: auto !important; }\n      .ag-plans { grid-template-columns: 1fr !important; }\n      .ag-calc { grid-template-columns: 1fr !important; }\n      .ag-legal { grid-template-columns: 1fr !important; }\n      .ag-metrics { grid-template-columns: 1fr 1fr !important; }\n    }\n    @media (min-width: 901px) and (max-width: 1180px) {\n      .ag-kpi { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }\n    }\n    @media (max-width: 620px) {\n      .ag-kpi, .ag-kanban, .ag-portals, .ag-footer, .ag-form-row { grid-template-columns: 1fr !important; }\n      .ag-vehicle { grid-template-columns: 1fr !important; }\n      .ag-metrics { grid-template-columns: 1fr !important; }\n    }\n  <\/style>\n<\/div>\n\n<\/x-dc>\n<script type=\"text\/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;whatsappNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;5583921491832&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contato&quot;},\n  &quot;planoDestaque&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Mais escolhido&quot;, &quot;options&quot;: [&quot;Mais escolhido&quot;, &quot;Recomendado&quot;, &quot;Melhor custo&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Planos&quot;},\n  &quot;reducaoPatio&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 15, &quot;min&quot;: 5, &quot;max&quot;: 30, &quot;step&quot;: 1, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Calculadora&quot;},\n  &quot;ganhoMargem&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 2, &quot;min&quot;: 0.5, &quot;max&quot;: 6, &quot;step&quot;: 0.5, &quot;unit&quot;: &quot;pp&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Calculadora&quot;}\n}\">\nclass Component extends DCLogic {\n  state = { estoque: 32, ticket: 65000, margem: 11, patio: 62 };\n\n  set = (key) => (e) => this.setState({ [key]: Number(e.target.value) });\n\n  componentDidMount() {\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    document.documentElement.classList.add('ag-js');\n    this.io = new IntersectionObserver((entries) => {\n      for (const entry of entries) {\n        if (!entry.isIntersecting) continue;\n        entry.target.setAttribute('data-shown', '');\n        this.io.unobserve(entry.target);\n      }\n    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.12 });\n    this.scan();\n  }\n\n  componentDidUpdate() { this.scan(); }\n\n  scan() {\n    if (!this.io) return;\n    document.querySelectorAll('[data-reveal]:not([data-shown]), [data-stagger]:not([data-shown])').forEach((el) => {\n      if (el.dataset.agWatched) return;\n      el.dataset.agWatched = '1';\n      this.io.observe(el);\n    });\n  }\n\n  componentWillUnmount() {\n    if (this.io) this.io.disconnect();\n  }\n\n  renderVals() {\n    const number = this.props.whatsappNumber || '5583921491832';\n    \/\/ Mensagem padronizada por origem do clique: a equipe sabe de onde veio\n    \/\/ o contato na primeira linha da conversa, sem precisar perguntar.\n    const wa = (texto) => `https:\/\/wa.me\/${number}?text=${encodeURIComponent(texto)}`;\n    const highlight = this.props.planoDestaque || 'Mais escolhido';\n\n    const { estoque, ticket, margem, patio } = this.state;\n    const reducaoPatio = this.props.reducaoPatio ?? 15;\n    const ganhoMargem = this.props.ganhoMargem ?? 2;\n\n    const patioDepois = patio * (1 - reducaoPatio \/ 100);\n    const vendasHoje = estoque * (365 \/ patio);\n    const vendasDepois = estoque * (365 \/ patioDepois);\n    const lucroHoje = vendasHoje * ticket * (margem \/ 100);\n    const lucroDepois = vendasDepois * ticket * ((margem + ganhoMargem) \/ 100);\n    const ganhoAno = lucroDepois - lucroHoje;\n\n    const brl = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });\n    const curto = (v) => v >= 1000000\n      ? `R$ ${(v \/ 1000000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} mi`\n      : `R$ ${Math.round(v \/ 1000).toLocaleString('pt-BR')} mil`;\n\n    return {\n      estoque, ticket, margem, patio,\n      reducaoLabel: `${reducaoPatio}%`,\n      margemGanhoLabel: `${ganhoMargem.toLocaleString('pt-BR', { maximumFractionDigits: 1 })} pontos`,\n      estoqueLabel: `${estoque} carros`,\n      ticketLabel: brl(ticket),\n      margemLabel: `${margem.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`,\n      patioLabel: `${patio} dias`,\n      onEstoque: this.set('estoque'),\n      onTicket: this.set('ticket'),\n      onMargem: this.set('margem'),\n      onPatio: this.set('patio'),\n      ganhoAnoLabel: curto(ganhoAno),\n      ganhoMesLabel: curto(ganhoAno \/ 12),\n      vendasHoje: Math.round(vendasHoje),\n      vendasDepois: Math.round(vendasDepois),\n      patioHoje: `${patio} dias`,\n      patioDepois: `${Math.round(patioDepois)} dias`,\n      lucroHojeLabel: curto(lucroHoje),\n      lucroDepoisLabel: curto(lucroDepois),\n      capitalLabel: curto(estoque * ticket * (1 - margem \/ 100)),\n      barraGanho: `${Math.max(0, Math.min(100, (ganhoAno \/ lucroDepois) * 100)).toFixed(1)}%`,\n      waLink: wa('Ol\u00e1! Vim pelo site do AutoGiro DMS e quero falar com um consultor sobre a gest\u00e3o da minha loja.'),\n      waLinkDemo: wa('Ol\u00e1! Vim pelo site do AutoGiro DMS e quero agendar uma demonstra\u00e7\u00e3o do sistema.'),\n      waLinkSuporte: wa('Ol\u00e1! Vim pelo site do AutoGiro DMS e preciso de ajuda do suporte.'),\n      badgeLabel: highlight,\n    };\n  }\n}\n<\/script>\n\n\n<script src=\"\/demo-modal.js\" defer><\/script>\n<\/body><\/html>"</script>
